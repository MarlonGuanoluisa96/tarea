<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="scripts j/estilos.css">
    <title>Intro a JS</title>
</head>
<body>
    <!--Cabecera-->
    <div>
        <header>
            <h1>Aplicacion que calcula numeros primos, mayor, menor o igual que</h1>
        </header>
        <form action="" id="formRCalculo">
            <div>
                <label for="">Ingrese el Primer Numero</label>
                <input type="number" id="primer" required>
            </div>
            
            <div>
                <label for="">Ingrese el Segundo Numero</label>
                <input type="number" id="segundo" required>
            </div>
            <div>
                <input type="submit" value="Mostrar resultado">
            </div>
            <div>
                <input type="reset" value="Limpiar campos">
            </div>
        </form>
        <div>
            <h3>Mostrando Datos registrados</h3>
            <div id="resultado"></div>
        </div>
    </div>
<script src="js/procesador.js"></script>
</body>
</html>
